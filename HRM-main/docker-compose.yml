version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dts-hrm-db
    environment:
      POSTGRES_DB: dts_hrm
      POSTGRES_USER: dts_hrm
      POSTGRES_PASSWORD: dts_hrm_secret
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dts_hrm']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: dts-hrm-api
    environment:
      DATABASE_URL: postgresql://dts_hrm:dts_hrm_secret@postgres:5432/dts_hrm?schema=public
      JWT_SECRET: dts-hrm-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dts-hrm-refresh-secret-change-in-production
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: dts-hrm-web
    ports:
      - '5173:5173'
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:3000/api/v1

volumes:
  pgdata:
  api_uploads:
